<svg xmlns="http://www.w3.org/2000/svg" width="1200"
  height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="title desc">
  <title id="title">Cooperative reduction：单 phase 运行协议</title>
  <desc id="desc">所有分片先写 partial 并无条件到达原生屏障。只有 shard 0 合并与写回，其他分片完成；整个 kernel 结束后释放工作空间。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4"
      orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#66758a"/>
    </marker>
  </defs>
  <rect width="1200" height="100%" fill="white"/>
  <text text-anchor="middle" fill="#203047" font-size="28"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="600">
    <tspan x="600" y="39.8">Cooperative reduction：单 phase 运行协议</tspan>
  </text>
  <polyline points="510,150 510,200" fill="none" stroke="#66758a"
    stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="510,280 510,330" fill="none" stroke="#66758a"
    stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="510,410 510,460" fill="none" stroke="#66758a"
    stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="510,545 510,605" fill="none" stroke="#66758a"
    stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="510,715 510,805" fill="none" stroke="#66758a"
    stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="740,660 900,660" fill="none" stroke="#66758a"
    stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="450,900 450,1000" fill="none" stroke="#66758a"
    stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="1030,700 1030,960 900,960 900,1000" fill="none" stroke="#66758a"
    stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="150" y="80" width="720" height="70" rx="14"
    fill="#eef4ff" stroke="#6483c5" stroke-width="2"/>
  <text text-anchor="middle" fill="#203047" font-size="23"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="510.0" y="123.05">所有 program：计算 row、shard 与输入区间</tspan>
  </text>
  <rect x="150" y="200" width="720" height="80" rx="14"
    fill="#eef4ff" stroke="#6483c5" stroke-width="2"/>
  <text text-anchor="middle" fill="#203047" font-size="23"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="510.0" y="231.55">本片 prologue、BLOCK_SUB 循环</tspan>
    <tspan x="510.0" y="264.55">局部 sum</tspan>
  </text>
  <rect x="150" y="330" width="720" height="80" rx="14"
    fill="#eef4ff" stroke="#6483c5" stroke-width="2"/>
  <text text-anchor="middle" fill="#203047" font-size="23"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="510.0" y="361.55">每个分片写 W[row, shard]</tspan>
    <tspan x="510.0" y="394.55">空片写 identity 0</tspan>
  </text>
  <rect x="150" y="460" width="720" height="85" rx="14"
    fill="#fff5de" stroke="#c7993d" stroke-width="2"/>
  <text text-anchor="middle" fill="#203047" font-size="23"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="510.0" y="494.05">所有参与者无条件执行</tspan>
    <tspan x="510.0" y="527.05">原生 all_vector barrier</tspan>
  </text>
  <polygon points="510,605 740,660 510,715 280,660" fill="#eef4ff" stroke="#6483c5" stroke-width="2"/>
  <text text-anchor="middle" fill="#203047" font-size="23"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="510.0" y="668.05">shard = 0？</tspan>
  </text>
  <rect x="100" y="805" width="700" height="95" rx="14"
    fill="#eef4ff" stroke="#6483c5" stroke-width="2"/>
  <text text-anchor="middle" fill="#203047" font-size="23"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="450.0" y="844.05">读取同组有效 partial；合并</tspan>
    <tspan x="450.0" y="877.05">标量 epilogue；唯一写回</tspan>
  </text>
  <rect x="900" y="620" width="260" height="80" rx="14"
    fill="#f2f4f7" stroke="#8d99aa" stroke-width="2"/>
  <text text-anchor="middle" fill="#203047" font-size="21"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="1030.0" y="667.35">本 program 完成</tspan>
  </text>
  <rect x="150" y="1000" width="900" height="90" rx="14"
    fill="#e9f7f1" stroke="#4d927e" stroke-width="2"/>
  <text text-anchor="middle" fill="#203047" font-size="23"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="600.0" y="1036.55">整个 kernel 完成</tspan>
    <tspan x="600.0" y="1069.55">stream 顺序保护 workspace 生命周期</tspan>
  </text>
  <text text-anchor="middle" fill="#203047" font-size="18"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="565" y="766.3">是：终结归约 owner</tspan>
  </text>
  <text text-anchor="middle" fill="#203047" font-size="17"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="825" y="600.95">否：已越过屏障</tspan>
  </text>
  <text text-anchor="middle" fill="#203047" font-size="19"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="600" y="1126.65">单 phase：owner 判断位于屏障后；其他分片不重复 peer load / combine</tspan>
  </text>
</svg>
