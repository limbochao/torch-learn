    <tspan x="1095" y="686.3">全失败</tspan>
  </text>
  <text text-anchor="middle" fill="#203047" font-size="17"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="1005" y="1035.95">其余合法候选</tspan>
  </text>
  <text text-anchor="middle" fill="#203047" font-size="19"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="600" y="1446.65">蓝：Inductor    绿：TA / NPU 执行    紫：NPUIR    灰：普通路径 / 淘汰</tspan>
  </text>
