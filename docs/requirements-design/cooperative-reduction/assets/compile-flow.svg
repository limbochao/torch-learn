  </text>
  <rect x="190" y="625" width="620" height="80" rx="14"
    fill="#eef4ff" stroke="#6483c5" stroke-width="2"/>
  <text text-anchor="middle" fill="#203047" font-size="23"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="500.0" y="656.55">Index codegen</tspan>
    <tspan x="500.0" y="689.55">partial / 原生 barrier / owner combine</tspan>
  </text>
  <rect x="190" y="750" width="620" height="80" rx="14"
    fill="#e9f7f1" stroke="#4d927e" stroke-width="2"/>
  <text text-anchor="middle" fill="#203047" font-size="23"
