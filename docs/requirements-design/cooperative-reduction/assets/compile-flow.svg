    <tspan x="500.0" y="814.55">确定 program 到物理参与者的映射</tspan>
  </text>
  <rect x="190" y="875" width="620" height="80" rx="14"
    fill="#f4edff" stroke="#9671c4" stroke-width="2"/>
  <text text-anchor="middle" fill="#203047" font-size="23"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
