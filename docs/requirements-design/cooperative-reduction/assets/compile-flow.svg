  <polyline points="500,705 500,750" fill="none" stroke="#66758a"
    stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="500,830 500,875" fill="none" stroke="#66758a"
    stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="500,955 500,1050" fill="none" stroke="#66758a"
    stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="500,1130 500,1175" fill="none" stroke="#66758a"
    stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="500,1265 500,1320" fill="none" stroke="#66758a"
    stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="820,220 1030,220 1030,360" fill="none" stroke="#66758a"
    stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="810,365 850,365 850,395 900,395" fill="none" stroke="#66758a"
    stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="820,505 850,505 850,425 900,425" fill="none" stroke="#66758a"
