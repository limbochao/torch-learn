  <text text-anchor="middle" fill="#203047" font-size="23"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="500.0" y="108.05">ATen reduction 与输入信息</tspan>
  </text>
  <polygon points="500,160 820,220 500,280 180,220" fill="#eef4ff" stroke="#6483c5" stroke-width="2"/>
  <text text-anchor="middle" fill="#203047" font-size="21"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="500.0" y="211.85">NPU 准入</tspan>
    <tspan x="500.0" y="242.85">A5 / SIMD / 静态 / fp32 sum</tspan>
  </text>
  <rect x="190" y="325" width="620" height="80" rx="14"
    fill="#eef4ff" stroke="#6483c5" stroke-width="2"/>
  <text text-anchor="middle" fill="#203047" font-size="23"
