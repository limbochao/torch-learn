    <tspan x="500.0" y="906.55">NPUIR：设备 lowering</tspan>
    <tspan x="500.0" y="939.55">资源与同步 metadata</tspan>
  </text>
  <rect x="190" y="1050" width="620" height="80" rx="14"
    fill="#eef4ff" stroke="#6483c5" stroke-width="2"/>
  <text text-anchor="middle" fill="#203047" font-size="23"
