<svg xmlns="http://www.w3.org/2000/svg" width="1200"
  height="1490" viewBox="0 0 1200 1490" role="img" aria-labelledby="title desc">
  <title id="title">Cooperative reduction：编译与依赖流程</title>
  <desc id="desc">Inductor 准入与 Index codegen 经 TA 和 NPUIR 编译后选择合法候选并执行；不支持或全部失败时走普通归约。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4"
      orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#66758a"/>
    </marker>
  </defs>
  <rect width="1200" height="100%" fill="white"/>
  <text text-anchor="middle" fill="#203047" font-size="28"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="600">
    <tspan x="600" y="39.8">Cooperative reduction：编译与依赖流程</tspan>
  </text>
  <polyline points="500,135 500,160" fill="none" stroke="#66758a"
