    <tspan x="500.0" y="1244.55">partial workspace 与隐式 lock ABI</tspan>
  </text>
  <rect x="190" y="1320" width="620" height="70" rx="14"
    fill="#e9f7f1" stroke="#4d927e" stroke-width="2"/>
  <text text-anchor="middle" fill="#203047" font-size="23"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="500.0" y="1363.05">A5 SIMD cooperative kernel</tspan>
  </text>
  <rect x="900" y="360" width="260" height="90" rx="14"
    fill="#f2f4f7" stroke="#8d99aa" stroke-width="2"/>
  <text text-anchor="middle" fill="#203047" font-size="20"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="1030.0" y="397">当前普通 reduction</tspan>
    <tspan x="1030.0" y="427">含 no-linear 回退</tspan>
  </text>
  <rect x="900" y="870" width="260" height="120" rx="14"
    fill="#f2f4f7" stroke="#8d99aa" stroke-width="2"/>
  <text text-anchor="middle" fill="#203047" font-size="20"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="1030.0" y="922">淘汰失败候选</tspan>
    <tspan x="1030.0" y="952">全失败则回退</tspan>
  </text>
  <text text-anchor="middle" fill="#203047" font-size="18"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="565" y="307.3">通过</tspan>
  </text>
  <text text-anchor="middle" fill="#203047" font-size="18"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="1080" y="291.3">不通过</tspan>
  </text>
  <text text-anchor="middle" fill="#203047" font-size="17"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="910" y="320.95">超出范围</tspan>
  </text>
  <text text-anchor="middle" fill="#203047" font-size="17"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="920" y="535.95">S=1 或无候选</tspan>
  </text>
  <text text-anchor="middle" fill="#203047" font-size="18"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="590" y="601.3">S&gt;1，存在合法候选</tspan>
  </text>
  <text text-anchor="middle" fill="#203047" font-size="17"
    font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"
    font-weight="400">
    <tspan x="850" y="855.95">候选失败</tspan>
  </text>
  <text text-anchor="middle" fill="#203047" font-size="18"
